<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Sheets</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128167;</text></svg>">
<style>
/* Tokens ported from the original (levi-sheet/draftroom/app.html, V36):
 * paper-ledger light set, split DATA vs CHROME. Theme blocks land in M4. */
:root{
  --ground:#f6f3ec; --zebra:#efece2; --surface:#fbf9f4; --raised:#eae6da;
  --input:#fdfcf8;
  --sel:#dde7f2; --focus:#2f5f9e;
  --line:#d9d4c6; --line-soft:#e3dfd3;
  --text:#2a2733; --muted:#5c5850; --faint:#8a857b;
  --purple:#5b4397; --purple-soft:#dde7f2;
  --gold:#7a5410; --gold-hi:#5e400a; --gold-dim:#c9b57e;
  --good:#0d6b46; --bad:#a63a30; --warn:#a96a12;
  --c-bg:#e6e0d0; --c-panel:#ded7c5; --c-line:#c6bea9;
  --c-text:#2a2733; --c-muted:#655e50; --c-chip:#efeadd;
  --c-gold:#7a5410; --c-brand:#5b4397;
  --picked-bg:#f3ead3; --mine-bg:#f0e7cd; --mine-odd:#ece2c4;
  --stamp-bg:rgba(253,251,244,.96);
  --pos-qb:#1f6db3; --pos-rb:#118a67; --pos-wr:#c05e14;
  --pos-te:#c23e7b; --pos-k:#79842a; --pos-def:#a67d1c;
  --posbg-qb:#e3eefb; --posbg-rb:#e0f2ec; --posbg-wr:#f9e9dc;
  --posbg-te:#f9e3ef; --posbg-k:#eef0d8; --posbg-def:#f7ecd2;
  --disp:"Copperplate","Copperplate Gothic Bold",Georgia,serif;
  --ui:Verdana,Geneva,"DejaVu Sans",sans-serif;
  --mono:Menlo,"SF Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--ground);color:var(--text);font-family:var(--ui);
  font-size:15px;font-variant-numeric:tabular-nums;overflow:hidden}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;color:inherit}
::selection{background:var(--purple-soft)}
#errbar{display:none;position:fixed;top:0;left:0;right:0;z-index:99;
  background:#b33049;color:#fff;padding:8px 14px;font-size:13px;
  font-family:var(--mono);font-weight:700}

/* ---------- top chrome bar ---------- */
header{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;
  border-bottom:2px solid var(--c-line);background:var(--c-bg)}
#mast{font-family:var(--disp);font-size:15px;letter-spacing:.12em;
  color:var(--c-brand);white-space:nowrap}
#mast small{display:block;font-family:var(--ui);font-size:9px;
  letter-spacing:.26em;color:var(--c-muted);font-weight:700}
header .ver{color:var(--c-muted);font-size:10px;font-family:var(--mono)}
.gearwrap{position:relative;margin-left:auto}
#gearbtn{display:inline-flex;align-items:center;padding:7px 9px;
  border:1px solid var(--c-line);border-radius:4px;background:var(--c-chip);
  color:var(--c-muted)}
#gearbtn:hover{color:var(--c-text)}
.gearmenu{position:absolute;right:0;top:calc(100% + 6px);
  background:var(--c-chip);border:1px solid var(--c-line);border-radius:6px;
  box-shadow:0 12px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;
  min-width:200px;z-index:40;overflow:hidden;padding:6px}
.gearmenu[hidden]{display:none}
.gearmenu button{border:none;background:none;border-radius:4px;
  text-align:left;padding:8px 10px;font-size:13px;color:var(--c-text)}
.gearmenu button:hover{background:var(--c-bg)}

/* ---------- topbar chips row ---------- */
.topbar{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;
  padding:8px 16px;background:var(--c-bg);border-bottom:1px solid var(--c-line)}
.chip{font-size:12px;color:var(--c-muted);border:1px solid var(--c-line);
  border-radius:4px;padding:4px 10px;white-space:nowrap;background:var(--c-chip);
  line-height:1.35;min-height:44px;display:flex;flex-direction:column;
  justify-content:center}
.chip .lab{display:block;font-size:9px;letter-spacing:.16em;color:var(--c-muted);
  text-transform:uppercase}
.chip b{color:var(--c-text);font-family:var(--mono);font-size:13px}
.chip .g{color:var(--c-gold);font-family:var(--mono);font-weight:700}
.chip .cval{display:flex;gap:5px;align-items:baseline;white-space:nowrap}
.topbar .spacer{flex:1}
#infl.hot b{color:var(--warn)}
.bar{display:block;margin-top:4px;height:4px;width:100%;background:var(--c-line);
  border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-gold)}
.gauge{display:block;position:relative;margin-top:5px;height:4px;
  background:var(--c-line);border-radius:2px;min-width:76px}
.gauge::after{content:"";position:absolute;left:50%;top:-2px;width:1px;
  height:8px;background:var(--c-muted)}
.gauge i{position:absolute;top:-2px;width:8px;height:8px;border-radius:50%;
  background:var(--c-gold);transform:translateX(-50%)}
.segs{display:flex;gap:2px;margin-top:5px}
.segs i{width:9px;height:4px;border-radius:1px;background:var(--c-line)}
.topbar > button{font-size:12px;font-weight:700;letter-spacing:.08em;
  color:var(--c-muted);border:1px solid var(--c-line);border-radius:4px;
  padding:8px 12px;background:var(--c-chip);align-self:center}
.topbar > button:hover{color:var(--c-text)}
.topbar > button.danger:hover{color:var(--bad);border-color:var(--bad)}

/* ---------- layout: full-viewport app frame (ported); the page never
 * scrolls, the board and rail scroll inside their own columns ---------- */
#main{display:flex;flex-direction:column;height:calc(100% - 56px);
  overflow-y:auto}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:1fr 336px}
.boardcol{min-width:0;overflow-y:auto;border-right:2px solid var(--line)}
.cols{display:grid;grid-template-columns:1fr 1.05fr 1.05fr 1fr .8fr;gap:1px;
  background:var(--line-soft)}
.poscol{background:var(--ground);min-width:0}
.colhead{position:sticky;top:0;z-index:2;background:var(--surface);
  border-bottom:2px solid var(--line);padding:8px 8px 0}
.colhead .t1{display:flex;align-items:baseline;gap:8px;font-weight:700;
  font-size:14px;letter-spacing:.1em;color:var(--text)}
.colhead .t1 small{font-weight:400;font-size:10px;letter-spacing:.02em;
  color:var(--faint);cursor:help}
.colhead .t2{display:grid;gap:6px;padding:5px 0 4px;font-size:9px;
  letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.colhead .t2 span:last-child,.colhead .t2 span.r{text-align:right}
.sortable{cursor:pointer}
.sortable.on{color:var(--text);text-decoration:underline}
.sortable:hover{color:var(--text)}
.kd{cursor:pointer;color:var(--faint)}
.kd.on{color:var(--text);text-decoration:underline}
.kd:hover{color:var(--text)}

/* ---------- board rows (ported verbatim) ---------- */
.grid-skill{grid-template-columns:18px 1fr 34px 36px 48px}
.row .pts,.t2 .pts{text-align:right;color:var(--faint);font-family:var(--mono);
  font-size:11px}
.grid-kdef{grid-template-columns:1fr 48px}
.row{display:grid;gap:6px;align-items:center;padding:5px 8px;cursor:pointer;
  user-select:none;border-left:3px solid transparent;line-height:1.3}
.rows .row:nth-child(odd){background:var(--zebra)}
.row:hover,.rows .row:nth-child(odd):hover{background:var(--sel)}
.row .tier{font-family:var(--mono);font-size:12px;color:var(--faint);
  text-align:center}
.row.t-open{border-top:2px solid var(--line)}
.row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:14.5px}
.row .tm{color:var(--faint);font-size:12px;margin-left:4px}
.row .inj{color:var(--bad);font-size:11px;font-weight:700;margin-left:3px}
.row .rk{color:var(--muted);font-size:11px;font-weight:700;margin-left:3px}
.row .edge{font-family:var(--mono);font-size:13px;text-align:right;
  color:var(--faint);font-variant-numeric:tabular-nums}
.row .edge.up{color:var(--good);font-weight:700}
.row .edge.dn{color:var(--bad)}
.row .usd{font-family:var(--mono);font-size:14.5px;font-weight:700;
  color:var(--gold);text-align:right;font-variant-numeric:tabular-nums}
.row .mkt{font-family:var(--mono);font-size:13.5px;color:var(--gold);
  text-align:right;font-variant-numeric:tabular-nums}
.row.sold .nm{text-decoration:line-through;color:var(--muted)}
.row.sold .tier{opacity:.4}
.row.sold .usd,.row.sold .mkt{color:var(--muted);font-weight:400;font-size:11.5px}
.more{display:block;width:100%;text-align:left;padding:7px 8px 14px 30px;
  color:var(--focus);font-size:13px;font-weight:700}
.more:hover{text-decoration:underline}
.freebar{display:flex;align-items:center;gap:8px;margin:7px 6px 2px;
  font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--faint);
  user-select:none}
.freebar span{flex:1;border-top:2px solid var(--line)}
.subhead{padding:4px 8px;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);background:var(--raised)}

/* position colors */
.pQB{color:var(--pos-qb) !important}
.pRB{color:var(--pos-rb) !important}
.pWR{color:var(--pos-wr) !important}
.pTE{color:var(--pos-te) !important}
.pK{color:var(--pos-k) !important}
.pDEF{color:var(--pos-def) !important}

/* staged pulse (ported) */
.row.staged{border-left-color:var(--gold);
  animation:bidglow 2.4s ease-in-out infinite}
@keyframes bidglow{
  0%,100%{box-shadow:inset 0 0 0 1px var(--gold-dim)}
  50%{box-shadow:inset 0 0 0 2px var(--gold),0 0 14px rgba(217,166,72,.4)}}
@media (prefers-reduced-motion:reduce){
  .row.staged{animation:none;box-shadow:inset 0 0 0 2px var(--gold)}}

/* ---------- rail (ported) ---------- */
#rail{display:flex;flex-direction:column;background:var(--c-panel);
  gap:8px;padding:8px;color:var(--text);overflow-y:auto}
.panel{padding:12px 14px;background:var(--surface);border:1px solid var(--line);
  border-radius:6px}
.panel h2{font-size:10px;font-weight:700;letter-spacing:.22em;color:var(--muted);
  margin-bottom:9px;text-transform:uppercase}
#q{width:100%;background:var(--input);border:1px solid var(--line);
  border-radius:4px;padding:9px 11px;font-size:14px;outline:none}
#q:focus{border-color:var(--focus)}
#hits{margin-top:2px}
.hit{display:flex;gap:8px;align-items:center;width:100%;padding:6px 9px;
  border-radius:3px;font-size:13px;text-align:left}
.hit .p{color:var(--faint);font-size:11px;width:28px}
.hit .n{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hit .d{font-family:var(--mono);font-size:12px;color:var(--gold);font-weight:700}
.hit.sel,.hit:hover{background:var(--sel)}
#picked{display:none;margin-top:10px;padding:9px 11px;
  border:1px solid var(--gold-dim);border-radius:4px;background:var(--picked-bg)}
#picked .pnm{font-weight:700;font-size:14px}
#call{display:none;margin-top:8px;padding:10px 12px;border-radius:4px;
  border:1px solid var(--line);background:var(--surface)}
.cverdict{display:inline-block;font-size:11px;font-weight:700;
  letter-spacing:.14em;padding:3px 9px;border-radius:3px;text-transform:uppercase}
.cverdict.target{background:var(--good);color:#fff}
.cverdict.value{background:var(--gold);color:#fff}
.cverdict.last{background:var(--warn);color:#fff}
.cverdict.pass{background:var(--bad);color:#fff}
.cverdict.bench{background:var(--faint);color:#fff}
.cmax{margin-top:7px;font-size:14px}
.cmax b{font-family:var(--mono);font-size:18px;color:var(--gold)}
.cmax span{color:var(--faint);font-size:12px;font-family:var(--mono)}
#call ul{margin:7px 0 0;padding-left:16px}
#call li{font-size:12.5px;color:var(--muted);margin:3px 0;line-height:1.4}
#saleform{display:none;margin-top:10px}
.steplab{font-size:9px;letter-spacing:.16em;color:var(--faint);
  text-transform:uppercase;margin:8px 0 4px}
#price{width:96px;background:var(--input);border:1px solid var(--line);
  border-radius:4px;padding:8px 10px;font-family:var(--mono);font-size:18px;
  color:var(--gold);font-weight:700;outline:none}
#price:focus{border-color:var(--gold)}
#ogrid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:9px}
.obtn{display:flex;justify-content:space-between;gap:6px;padding:7px 8px;
  border:1px solid var(--line);border-radius:3px;font-size:12px;text-align:left;
  background:var(--ground)}
.obtn small{font-family:var(--mono);color:var(--faint)}
.obtn:hover,.obtn:focus{border-color:var(--focus);outline:none;background:var(--sel)}
.obtn.me{border-color:var(--gold-dim)}
.obtn.out{opacity:.4}
.obtn.selected{border-color:var(--focus);border-width:2px;background:var(--sel);
  color:var(--text);font-weight:700}
#summary{display:none;margin-top:10px;font-size:13px;color:var(--muted)}
#summary b{color:var(--text)}
#summary .g{color:var(--gold);font-family:var(--mono);font-weight:700}
#sold{display:block;width:100%;margin-top:9px;padding:11px;border-radius:4px;
  border:1px solid var(--gold-hi);color:#fdf9ee;background:var(--gold);
  font-weight:700;font-size:14px;letter-spacing:.14em}
#sold:hover:not(:disabled){background:var(--gold-hi)}
#sold:disabled{background:var(--surface);color:var(--faint);
  border-color:var(--line);cursor:default}
#msg{margin-top:7px;font-size:13px;font-weight:700;color:var(--bad);
  min-height:15px}

/* owner ledger (ported) */
.ohead,.orow{display:grid;grid-template-columns:1fr 46px 46px 32px;gap:6px}
.ohead{font-size:9px;letter-spacing:.14em;color:var(--faint);
  text-transform:uppercase;padding-bottom:5px;border-bottom:1px solid var(--line);
  margin-bottom:3px}
.ohead span:not(:first-child){text-align:right}
.orow{padding:3.5px 2px;font-size:13px;align-items:center}
.orow:nth-child(even){background:var(--zebra)}
.orow.me{font-weight:700}
.orow.me span:first-child{color:var(--gold-hi)}
.orow.out{opacity:.45}
.orow .m{font-family:var(--mono);font-size:12px;text-align:right}
.orow .m.g{color:var(--gold);font-weight:700}
.orow .sp{color:var(--faint);text-align:right;font-family:var(--mono);
  font-size:11px}

/* roster (ported) */
#roster .slot{display:flex;gap:8px;padding:3px 0;font-size:13px}
#roster .slot:nth-child(odd){background:var(--zebra)}
#roster .slot .lab{width:36px;color:var(--faint);font-family:var(--mono);
  font-size:11px;padding-top:1px}
#roster .slot .who{flex:1;color:var(--faint)}
#roster .slot.filled .who{color:var(--text)}
#roster .slot .pr{font-family:var(--mono);font-size:12px;color:var(--gold);
  font-weight:700}
#rostersel{background:var(--surface);color:var(--muted);border:none;
  outline:none;font-family:var(--ui);font-size:10px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;cursor:pointer;padding:0;
  max-width:100%}

/* ---------- modal (ported) ---------- */
#ovl{display:none;position:fixed;inset:0;background:rgba(43,37,54,.35);
  z-index:10;align-items:center;justify-content:center}
#modal{width:410px;max-height:80vh;overflow-y:auto;background:var(--ground);
  border:1px solid var(--line);border-radius:6px;padding:20px 22px;
  box-shadow:0 20px 60px rgba(43,37,54,.35)}
#modal h3{font-size:18px}
#modal .sub{color:var(--muted);font-size:13px;margin:3px 0 14px}
#mtable{width:100%;font-family:var(--mono);font-size:13px;
  border-collapse:collapse}
#mtable td{padding:5px 0;border-bottom:1px solid var(--line-soft)}
#mtable td:last-child{text-align:right}
#mtable .g{color:var(--gold);font-weight:700}
#msell{margin-top:14px;width:100%;padding:10px;border:1px solid var(--gold-dim);
  border-radius:4px;color:var(--gold-hi);font-weight:700;font-size:12px;
  letter-spacing:.14em;background:var(--picked-bg)}
#msell:hover{background:var(--raised)}
#mrev{margin-top:14px;width:100%;padding:10px;border:1px solid var(--bad);
  border-radius:4px;color:var(--bad);font-weight:700;font-size:12px;
  letter-spacing:.14em;background:none}
#mrev:hover{background:var(--raised)}

/* sold stamp (ported) */
#stamp{display:none;position:fixed;left:50%;top:40%;z-index:20;
  transform:translate(-50%,-50%) rotate(-7deg);
  border:3px solid var(--gold);border-radius:6px;padding:14px 30px;
  font-family:var(--disp);font-size:27px;letter-spacing:.2em;
  color:var(--gold-hi);background:var(--stamp-bg);
  box-shadow:0 12px 50px rgba(0,0,0,.35);pointer-events:none;text-align:center}
#stamp small{display:block;font-family:var(--mono);font-size:13px;
  letter-spacing:.02em;color:var(--text);margin-top:6px}
#stamp.show{display:block;animation:stamp .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-7deg) scale(1.6);
  opacity:0}
  to{transform:translate(-50%,-50%) rotate(-7deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){#stamp.show{animation:none}}

/* ---------- instant tooltip ---------- */
[data-tip]{position:relative;cursor:help}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:0;
  top:calc(100% + 6px);z-index:30;width:260px;padding:8px 10px;
  border-radius:7px;background:var(--text);color:var(--ground);font-size:12px;
  font-weight:normal;line-height:1.4;text-transform:none;letter-spacing:normal;
  white-space:normal;box-shadow:0 4px 14px rgba(0,0,0,.25);
  font-family:var(--ui)}

/* ---------- wizard + import (this app's own surfaces, on the same tokens) */
.bigpanel{max-width:620px;margin:4vh auto;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:26px}
.bigpanel.wide{max-width:980px}
.bigpanel h2{margin-bottom:10px;font-size:18px}
.bigpanel textarea{margin:10px 0}
.wizard{max-width:560px;margin:6vh auto;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:26px}
.crumbs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.crumb{font-size:11px;color:var(--faint);padding:3px 8px;border-radius:10px;
  border:1px solid var(--line)}
.crumb.on{background:var(--text);color:var(--ground);border-color:var(--text)}
.wizbody h2{margin-bottom:10px;font-size:18px}
.hint{color:var(--muted);font-size:13px;margin-bottom:16px}
.choices{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap;
  align-items:center}
.choice{border:1px solid var(--line);border-radius:6px;padding:7px 14px;
  background:var(--surface)}
.choice.on{background:var(--gold);color:#fdf9ee;border-color:var(--gold)}
.radio{display:inline-flex;gap:6px;align-items:center;font-size:14px;
  cursor:pointer}
.radio input{accent-color:var(--gold)}
button.primary{background:var(--gold);color:#fdf9ee;border:1px solid var(--gold-hi);
  border-radius:6px;padding:7px 14px}
button.primary.big{font-size:17px;padding:12px 26px}
button.primary:hover:not(:disabled){background:var(--gold-hi)}
button.ghost{background:transparent;border:1px solid var(--line);
  border-radius:6px;padding:7px 14px}
button.ghost.danger{color:var(--bad);border-color:var(--bad)}
button.ghost.tiny,.tiny{font-size:11px;padding:3px 8px}
button:disabled{opacity:.55;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0;
  font-size:13px;color:var(--muted)}
.field input{font:inherit;padding:6px 8px;border:1px solid var(--line);
  border-radius:6px;width:110px;color:var(--text);background:var(--input)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 14px}
.form{display:grid;grid-template-columns:1fr 110px;gap:8px 16px;
  align-items:center;margin-top:6px}
.formrow{display:contents}
.formrow span{font-size:13px;color:var(--muted);text-align:left}
.formrow input,.formrow select{font:inherit;padding:6px 8px;width:100%;
  border:1px solid var(--line);border-radius:6px;color:var(--text);
  text-align:right;background:var(--input)}
textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--line);
  border-radius:6px;background:var(--input)}
.wiznav{display:flex;justify-content:space-between;margin-top:22px}
.wiznav button:only-child{margin-left:auto}
.msg{color:var(--bad);font-size:13px;margin-top:10px}
.tblwrap{overflow-x:auto;margin:12px 0}
.maptable{border-collapse:collapse;font-size:12px;width:100%}
.maptable td,.maptable th{border:1px solid var(--line);padding:4px 7px;
  text-align:left;white-space:nowrap;max-width:180px;overflow:hidden;
  text-overflow:ellipsis}
.maptable tr.hdr td{background:var(--raised);font-weight:bold}
.maptable select{font:inherit;font-size:12px;max-width:100%;padding:3px;
  border:1px solid var(--line);border-radius:5px;background:var(--input);
  color:var(--text)}
.empty{text-align:center;margin-top:10vh;color:var(--muted)}
.empty button{margin-top:14px}
@media (max-width:1100px){.layout{grid-template-columns:1fr}
  #rail{order:-1}}
</style>
</head>
