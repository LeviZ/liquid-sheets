<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Sheets</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128167;</text></svg>">
<style>
:root {
  --bg: #f4f2ec; --panel: #ffffff; --ink: #23231f; --dim: #6b6960;
  --line: #dcd8cc; --accent: #0a6e5c; --accent-ink: #ffffff;
  --danger: #a33b2e;
  --pos-qb: #1f6db3; --pos-rb: #1d8a53; --pos-wr: #b3541f; --pos-te: #7a3fa0;
}
* { box-sizing: border-box; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.45 Verdana, Geneva, sans-serif;
  font-variant-numeric: tabular-nums;
}
header {
  display: flex; align-items: baseline; gap: 12px;
  padding: 14px 20px; border-bottom: 2px solid var(--ink);
}
header h1 { font-size: 20px; letter-spacing: 0.5px; }
header .ver { color: var(--dim); font-size: 11px; }
header .right { margin-left: auto; }
#main { padding: 18px 20px; max-width: 1280px; margin: 0 auto; }
button {
  font: inherit; cursor: pointer; border-radius: 6px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  padding: 7px 14px;
}
button.primary { background: var(--accent); color: var(--accent-ink);
  border-color: var(--accent); }
button.primary.big { font-size: 17px; padding: 12px 26px; }
button.ghost { background: transparent; }
button.ghost.danger { color: var(--danger); border-color: var(--danger); }
button:disabled { opacity: 0.55; cursor: default; }
.wizard { max-width: 560px; margin: 6vh auto; background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; padding: 26px; }
.crumbs { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
.crumb { font-size: 11px; color: var(--dim); padding: 3px 8px;
  border-radius: 10px; border: 1px solid var(--line); }
.crumb.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.wizbody h2 { margin-bottom: 10px; font-size: 18px; }
.hint { color: var(--dim); font-size: 13px; margin-bottom: 16px; }
.choices { display: flex; gap: 10px; margin: 14px 0; flex-wrap: wrap;
  align-items: center; }
.radio { display: inline-flex; gap: 6px; align-items: center;
  font-size: 14px; cursor: pointer; }
.radio input { accent-color: var(--accent); }
.choice.on { background: var(--accent); color: var(--accent-ink);
  border-color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 4px; margin: 10px 0;
  font-size: 13px; color: var(--dim); }
.field input { font: inherit; padding: 6px 8px; border: 1px solid var(--line);
  border-radius: 6px; width: 110px; color: var(--ink); }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px 14px; }
.form { display: grid; grid-template-columns: 1fr 110px; gap: 8px 16px;
  align-items: center; margin-top: 6px; }
.formrow { display: contents; }
.formrow span { font-size: 13px; color: var(--dim); text-align: left; }
.formrow input { font: inherit; padding: 6px 8px; width: 100%;
  border: 1px solid var(--line); border-radius: 6px; color: var(--ink);
  text-align: right; }
textarea { width: 100%; font: inherit; padding: 8px;
  border: 1px solid var(--line); border-radius: 6px; }
.wiznav { display: flex; justify-content: space-between; margin-top: 22px; }
.wiznav button:only-child { margin-left: auto; }
.msg { color: var(--danger); font-size: 13px; margin-top: 10px; }
.topbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  margin-bottom: 16px; }
.topbar .spacer { flex: 1; }
.chip { background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; padding: 3px 10px; font-size: 12px; color: var(--dim); }
.cols { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
.col h3 { font-size: 13px; letter-spacing: 1px; margin-bottom: 6px;
  padding: 4px 8px; border-radius: 5px; color: #fff; }
.pos-qb { background: var(--pos-qb); } .pos-rb { background: var(--pos-rb); }
.pos-wr { background: var(--pos-wr); } .pos-te { background: var(--pos-te); }
.pos-kdef { background: var(--dim); }
.rows { background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; overflow: hidden; }
.row { display: flex; gap: 6px; padding: 3px 8px; font-size: 13px; }
.row:nth-child(odd) { background: rgba(0, 0, 0, 0.03); }
.row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; }
.row .pts { color: var(--dim); width: 34px; text-align: right; }
.row .usd { width: 40px; text-align: right; font-weight: bold; }
.panel { max-width: 620px; margin: 4vh auto; background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; padding: 26px; }
.panel.wide { max-width: 980px; }
.panel h2 { margin-bottom: 10px; font-size: 18px; }
.panel textarea { margin: 10px 0; }
.tblwrap { overflow-x: auto; margin: 12px 0; }
.maptable { border-collapse: collapse; font-size: 12px; width: 100%; }
.maptable td, .maptable th { border: 1px solid var(--line); padding: 4px 7px;
  text-align: left; white-space: nowrap; max-width: 180px;
  overflow: hidden; text-overflow: ellipsis; }
.maptable tr.hdr td { background: var(--line); font-weight: bold; }
.maptable select, .formrow select { font: inherit; font-size: 12px;
  max-width: 100%; padding: 3px; border: 1px solid var(--line);
  border-radius: 5px; background: var(--panel); color: var(--ink); }
.row .deal { width: 34px; text-align: right; }
.deal.dpos { color: #1d8a53; font-weight: bold; }
.deal.dneg { color: var(--danger); }
.deal.dzero { color: var(--dim); }
.row.colhead { background: transparent; color: var(--dim); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.5px;
  border-bottom: 1px solid var(--line); }
.row.colhead .usd { font-weight: normal; }
.row.subhead { background: var(--line); color: var(--ink); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.5px; }
.tiercut { border-top: 2px solid var(--ink); opacity: 0.35; }
.empty { text-align: center; margin-top: 10vh; color: var(--dim); }
.empty button { margin-top: 14px; }
[data-tip] { position: relative; cursor: help; }
[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute; left: 0; top: calc(100% + 6px); z-index: 30;
  width: 260px; padding: 8px 10px; border-radius: 7px;
  background: var(--ink); color: var(--bg);
  font-size: 12px; font-weight: normal; line-height: 1.4;
  text-transform: none; letter-spacing: normal; white-space: normal;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
}
@media (max-width: 1100px) { .cols { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Liquid Sheets</h1>
  <span class="ver">V4 (M2)</span>
  <span class="right">
    <button id="exportbtn" class="ghost" data-tip="Saves everything (league, data, runs, draft) to one file. Do this before draft day.">Export backup</button>
    <button id="importbtn" class="ghost" data-tip="Restores a backup file: new device, cleared browser, or draft-day recovery.">Import backup</button>
  </span>
  <input id="importfile" type="file" accept="application/json" hidden>
</header>
<div id="main"></div>
<script type="module" src="app.js"></script>
</body>
</html>
